ext {
    // Aligned with the customer app reporting R8 release-mode issues:
    //   JDK 21 (set in app/capacitor.build.gradle by @capacitor/cli >=7.5)
    //   minSdk 27, compile/target 35, Gradle 8.11.1, AGP 8.11.1.
    minSdkVersion = 27
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    androidxBrowserVersion = '1.8.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    firebaseMessagingVersion = '24.1.1'

    // ML Kit Barcode Scanning - 16 KB page size support
    mlkitBarcodeScanningVersion = '17.3.0'
    playServicesCodeScannerVersion = '16.1.0'

    // CameraX - 16 KB page size support (requires 1.4.2+)
    androidxCameraCamera2Version = '1.5.1'
    androidxCameraCoreVersion = '1.5.1'
    androidxCameraLifecycleVersion = '1.5.1'
    androidxCameraViewVersion = '1.5.1'
}
